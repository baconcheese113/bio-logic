<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Strain — UI Wireframes v2 (immune assault)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Kalam:wght@400;700&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4ecdc;
    --paper-2:#ede3cf;
    --ink:#1f1d18;
    --ink-2:#3a352a;
    --ink-3:#6f6553;
    --rule:#2a261c;
    --hi:#c4471f;
    --bg:#e8dec4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Patrick Hand", "Kalam", ui-sans-serif, system-ui, sans-serif;}
  body{
    background:
      radial-gradient(1200px 700px at 20% 0%, #f0e6cd 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #e0d3b3 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    padding:28px 32px 80px;
  }

  /* ── Page header ─────────────────────────────────────────── */
  .page-hd{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;max-width:1480px;margin:0 auto 14px;
  }
  .page-hd h1{
    font-family:"Kalam",cursive;font-weight:700;
    font-size:36px;margin:0 0 2px;letter-spacing:.5px;
  }
  .page-hd h1 .sub{
    font-family:"Patrick Hand";font-weight:400;font-size:22px;color:var(--ink-3);margin-left:10px;
  }
  .page-hd .meta{
    font-size:15px;color:var(--ink-3);text-align:right;line-height:1.35;
  }
  .page-hd .meta b{color:var(--ink-2)}

  /* ── Tabs ─────────────────────────────────────────────────── */
  .tabs{
    display:flex;gap:0;max-width:1480px;margin:0 auto 18px;
    border-bottom:2px solid var(--rule);
    position:relative;
  }
  .tab{
    appearance:none;border:0;background:transparent;
    font:inherit;font-size:17px;color:var(--ink-2);
    padding:10px 18px 12px;cursor:pointer;
    border:2px solid transparent;border-bottom:0;
    margin-bottom:-2px;border-radius:10px 10px 0 0;
    transition:background .15s;
    position:relative;
  }
  .tab .tk{display:inline-block;width:22px;height:22px;margin-right:8px;
    border:1.5px solid var(--rule);border-radius:50%;text-align:center;line-height:20px;
    font-size:13px;background:var(--paper);vertical-align:-3px;font-family:"Kalam";font-weight:700;}
  .tab:hover{background:rgba(0,0,0,.04)}
  .tab.active{
    background:var(--paper);
    border-color:var(--rule);
    color:var(--ink);
  }
  .tab.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--paper);
  }
  .tab .tag{
    margin-left:8px;font-size:12px;color:var(--ink-3);
    border:1px dashed var(--ink-3);padding:1px 6px;border-radius:8px;
  }

  /* ── Tab body ─────────────────────────────────────────────── */
  .tab-body{
    max-width:1480px;margin:0 auto;
    background:var(--paper);
    border:2px solid var(--rule);border-top:0;
    border-radius:0 14px 14px 14px;
    padding:22px 26px 28px;
    box-shadow:0 2px 0 rgba(0,0,0,.05), 6px 6px 0 rgba(0,0,0,.06);
  }
  .intro{
    display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;
    margin-bottom:14px;align-items:start;
  }
  .intro h2{
    font-family:"Kalam";font-weight:700;font-size:26px;margin:0 0 6px;
  }
  .intro h2 .badge{
    display:inline-block;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;
    text-align:center;line-height:26px;font-size:18px;background:#fff;margin-right:8px;
  }
  .intro p{margin:4px 0;font-size:16px;line-height:1.45;color:var(--ink-2)}
  .intro .col h3{
    font-family:"Kalam";font-size:16px;margin:0 0 4px;color:var(--ink);
    text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  }

  /* ── Stage ─────────────────────────────────────────────────── */
  .stage{
    position:relative;
    background:var(--paper-2);
    border:2px solid var(--rule);
    border-radius:14px;
    padding:0;
    overflow:visible;
    box-shadow:3px 3px 0 rgba(0,0,0,.06);
  }

  /* Annotation chips */
  .anno{
    position:absolute;font-family:"Patrick Hand";font-size:13px;color:var(--ink);
    background:#fffbf0;border:1.2px solid var(--rule);
    border-radius:8px;padding:2px 7px;line-height:1.25;
    box-shadow:1.5px 1.5px 0 rgba(0,0,0,.18);
    pointer-events:none;white-space:nowrap;
    z-index:9;
  }
  .anno.tilt{transform:rotate(-2deg)}
  .anno.tilt-r{transform:rotate(2deg)}

  /* Arrow svg overlay */
  .anno-arrow{position:absolute;inset:0;pointer-events:none;z-index:8}
  .anno-arrow path{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-linecap:round}

  /* Notes block */
  .notes{
    margin-top:22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;
    padding-top:18px;border-top:1.5px dashed var(--ink-3);
  }
  .notes h4{font-family:"Kalam";font-weight:700;font-size:16px;margin:0 0 6px;
    text-transform:uppercase;letter-spacing:.06em}
  .notes p{margin:2px 0;font-size:14.5px;color:var(--ink-2);line-height:1.45}

  /* Dark mode */
  body.dark{
    --bg:#1a1812;
    --paper:#0d1320;
    --paper-2:#0a0f1a;
    --ink:#e8dfc8;
    --ink-2:#c5bda7;
    --ink-3:#8b8472;
    --rule:#c5bda7;
  }
  body.dark .page-hd h1{color:#f0e6cd}
  body.dark .tab.active{background:var(--paper)}
  body.dark .tab.active::after{background:var(--paper)}
  body.dark .anno{background:#1b1a14;border-color:#a89c80;color:#ede0bb;box-shadow:1.5px 1.5px 0 rgba(0,0,0,.4)}
  body.dark .tab-body{box-shadow:0 2px 0 rgba(0,0,0,.4), 6px 6px 0 rgba(0,0,0,.3)}
  body.dark .stage{box-shadow:3px 3px 0 rgba(0,0,0,.3)}
  body.dark .tab .tk{background:#1b1a14;color:#ede0bb}
</style>
</head>
<body>
  <header class="page-hd">
    <div>
      <h1>Strain<span class="sub">— UI wireframes v2 · immune assault</span></h1>
      <div style="font-size:15px;color:var(--ink-3);margin-top:2px">
        Real-time immunology survival · plasmid editor + biotech instruments · BioRender-style illustration
      </div>
    </div>
    <div class="meta">
      <div><b>Concept pivot</b> · v0.2</div>
      <div>Bacterial colony vs adaptive immune response</div>
      <div>Goal: <b>one moment, four philosophies</b></div>
    </div>
  </header>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="bio.jsx"></script>
  <script type="text/babel" src="panels.jsx"></script>
  <script type="text/babel" src="scene.jsx"></script>
  <script type="text/babel" src="variations2.jsx"></script>
  <script type="text/babel" src="app2.jsx"></script>
</body>
</html>
