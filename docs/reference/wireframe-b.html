<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malignant Wireframe B - Split Attention</title>
  <style>
    :root {
      color-scheme: dark;
      --tissue: #2a201a;
      --tissue-line: #3a2e25;
      --panel: #17130f;
      --panel-soft: #211a14;
      --amber: #d2693a;
      --purple: #7d4aa8;
      --blue: #3a78b8;
      --red: #b8433f;
      --green: #79b568;
      --text: #f2dfc7;
      --muted: #b89f83;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f0c0a;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .wireframe {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(260px, 1fr);
      height: 100vh;
      overflow: hidden;
    }

    .map {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 30% 52%, rgba(122, 58, 58, 0.16), transparent 34%),
        radial-gradient(ellipse at 78% 26%, rgba(122, 58, 58, 0.13), transparent 31%),
        repeating-linear-gradient(30deg, transparent 0 24px, rgba(58, 46, 37, 0.55) 25px 26px),
        var(--tissue);
    }

    .map::before {
      content: "";
      position: absolute;
      inset: -20px;
      background-image:
        linear-gradient(30deg, transparent 47%, var(--tissue-line) 48% 52%, transparent 53%),
        linear-gradient(150deg, transparent 47%, var(--tissue-line) 48% 52%, transparent 53%),
        linear-gradient(90deg, transparent 47%, var(--tissue-line) 48% 52%, transparent 53%);
      background-size: 76px 44px;
      opacity: 0.42;
    }

    .channel {
      position: absolute;
      left: 7%;
      bottom: 12%;
      width: 62%;
      height: 56%;
      border: 5px solid transparent;
      border-bottom-color: var(--blue);
      border-right-color: var(--blue);
      border-radius: 0 0 48% 0;
      opacity: 0.85;
      transform: rotate(-18deg);
    }

    .founder {
      position: absolute;
      left: 12%;
      bottom: 11%;
      width: 58px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #8a3a18 0 34%, var(--amber) 36% 100%);
      border: 2px solid #fff4dc;
      box-shadow: 0 0 34px rgba(210, 105, 58, 0.65);
    }

    .unit {
      position: absolute;
      width: 14px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--amber);
      border: 1px solid #1a1612;
    }

    .combat { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); border-radius: 0; }
    .macrophage {
      position: absolute;
      width: 38px;
      aspect-ratio: 1;
      border-radius: 45% 55% 48% 52%;
      background: var(--purple);
      box-shadow: 13px 3px 0 -4px rgba(125, 74, 168, 0.82), -9px 10px 0 -5px rgba(125, 74, 168, 0.75);
    }

    .marker {
      position: absolute;
      width: 18px;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: 0 0 0 14px color-mix(in srgb, currentColor 16%, transparent), 0 0 20px currentColor;
    }

    .harvest { color: var(--blue); background: var(--blue); }
    .defend { color: var(--red); background: var(--red); }
    .nest {
      position: absolute;
      right: 9%;
      top: 20%;
      width: 70px;
      aspect-ratio: 1;
      background: #5a1619;
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
      box-shadow: 18px 10px 0 #3b1114, -15px 14px 0 #481317, 0 0 28px rgba(184, 67, 63, 0.45);
    }

    .lab-strip {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-left: 1px solid #3a2e25;
      background: linear-gradient(180deg, var(--panel), #0f0c0a);
    }

    .card {
      border: 1px solid #4a382b;
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 12px;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: 18px; }
    h2 { margin-bottom: 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; }
    p, .row, .slot, .part { font-size: 12px; }
    .row { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0; }
    .bar { height: 8px; border-radius: 999px; background: #34271f; overflow: hidden; }
    .fill { display: block; width: 62%; height: 100%; background: var(--blue); }
    .rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .slot, .part {
      min-height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #574131;
      border-radius: 6px;
      background: #120f0c;
      color: var(--muted);
      text-align: center;
    }
    .tray { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .part { padding: 8px; color: var(--text); border-color: #6b4d35; }
  </style>
</head>
<body>
  <main class="wireframe" aria-label="Wireframe B split attention reference">
    <section class="map">
      <div class="channel"></div>
      <div class="founder"></div>
      <div class="nest"></div>
      <div class="marker harvest" style="left:42%;top:45%"></div>
      <div class="marker defend" style="left:68%;top:35%"></div>
      <div class="unit" style="left:24%;top:55%"></div>
      <div class="unit" style="left:30%;top:50%"></div>
      <div class="unit combat" style="left:39%;top:44%"></div>
      <div class="unit combat" style="left:52%;top:36%"></div>
      <div class="macrophage" style="right:20%;top:34%"></div>
    </section>
    <aside class="lab-strip">
      <div>
        <h1>Split Attention</h1>
        <p>Battlefield left, lab chain right.</p>
      </div>
      <section class="card">
        <h2>Instrument Chain</h2>
        <div class="row"><span>PCR</span><span>Running</span></div>
        <div class="bar"><span class="fill"></span></div>
        <div class="row"><span>Gel</span><span>Ready</span></div>
        <div class="row"><span>Band</span><span>400bp</span></div>
      </section>
      <section class="card">
        <h2>Plasmid Editor</h2>
        <div class="rail">
          <div class="slot">PROMOTER</div>
          <div class="slot">RBS</div>
          <div class="slot">GENE</div>
          <div class="slot">TERMINATOR</div>
        </div>
        <div class="tray">
          <div class="part">SOD</div>
          <div class="part">Generic RBS</div>
          <div class="part">Terminator</div>
        </div>
      </section>
      <section class="card">
        <h2>Incubator</h2>
        <p>Integrating plasmid across units.</p>
      </section>
    </aside>
  </main>
</body>
</html>
